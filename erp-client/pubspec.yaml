name: erp_client
description: "Enterprise Resource Planning (ERP) System Client Application."
publish_to: 'none'

# Versioning: [Major].[Minor].[Patch]+[Build Number]
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  # State Management & Routing
  get: ^4.7.3
  get_storage: ^2.1.1

  # API & Networking
  dio: ^5.11.0

  # Configuration & Environment Variables
  flutter_dotenv: ^6.0.1

  # Globalization & UI Utilities
  intl: ^0.20.3
  google_fonts: ^8.1.0
  lucide_icons: ^0.257.0

  # Icons
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  # Assets Configuration
  assets:
    - .env
    # Add your image folders here as you progress, for example:
    # - assets/images/
    # - assets/logos/

  # Custom Fonts Configuration (Uncomment when adding local fonts)
  # fonts:
  #   - family: YourCustomFont
  #     fonts:
  #       - asset: assets/fonts/YourFont-Regular.ttf
  #       - asset: assets/fonts/YourFont-Bold.ttf
  #         weight: 700